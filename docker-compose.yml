# Local development stack.
#
# Production does NOT use this file — see docker/docker-compose.prod.yml and
# docs/deployment.md. In particular, Postgres and Redis here hold development
# data only, and application media in any real environment lives in R2.

name: dhakalive

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dhakalive
      POSTGRES_PASSWORD: dhakalive
      POSTGRES_DB: dhakalive
      # Bengali content requires a UTF-8 database; the C collation keeps index
      # ordering deterministic across platforms.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dhakalive -d dhakalive']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'no', '--save', '']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible storage standing in for Cloudflare R2 locally.
  #
  # R2 speaks the S3 API, so the same adapter, credentials shape and
  # path-style addressing are exercised here as in production. Started with
  # `--profile storage`; without it, uploads fall back to local disk.
  minio:
    image: minio/minio:latest
    profiles: ['storage']
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: dhakalive
      MINIO_ROOT_PASSWORD: dhakalive-dev-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: creates the bucket and makes it publicly readable, which is how an
  # R2 bucket bound to a custom domain behaves.
  minio-init:
    image: minio/mc:latest
    profiles: ['storage']
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 dhakalive dhakalive-dev-secret &&
      mc mb --ignore-existing local/dhakalive-media-dev &&
      mc anonymous set download local/dhakalive-media-dev
      "

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URI: postgres://dhakalive:dhakalive@postgres:5432/dhakalive
      REDIS_URL: redis://redis:6379
      # Web replicas must never run the job queue.
      JOBS_RUN_IN_PROCESS: 'false'
    ports:
      - '3000:3000'

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URI: postgres://dhakalive:dhakalive@postgres:5432/dhakalive
      REDIS_URL: redis://redis:6379
      JOBS_RUN_IN_PROCESS: 'true'
    # Exactly one runner. Scaling this races on scheduled publication.
    deploy:
      replicas: 1

volumes:
  postgres-data:
  minio-data:
