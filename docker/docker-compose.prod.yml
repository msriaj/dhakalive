# Production stack.
#
# Runs prebuilt images from the registry — production hosts do not compile
# anything. The image that was tested in CI is the image that runs.
#
# Postgres is deliberately NOT here. Use a managed database: it gives you
# automated backups, point-in-time recovery and failover, none of which a
# container on one box provides. If you must self-host it, run it outside this
# file with its own volume and backup schedule, so a `docker compose down -v`
# during an incident cannot delete the newspaper.
#
#   docker compose -f docker/docker-compose.prod.yml up -d
#
# Requires a .env alongside it. See docs/deployment.md.

name: dhakalive

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

x-app-env: &app-env
  env_file: [../.env]
  environment:
    APP_ENV: production
    NODE_ENV: production

services:
  app:
    image: ${WEB_IMAGE:-ghcr.io/msriaj/dhakalive-web:latest}
    restart: always
    <<: *app-env
    environment:
      APP_ENV: production
      NODE_ENV: production
      # Web replicas must never run the job queue: each replica would race the
      # others to publish the same scheduled article.
      JOBS_RUN_IN_PROCESS: 'false'
    expose:
      - '3000'
    ports:
      # Loopback only. Caddy reaches the app over the Docker network, so this
      # mapping exists purely so an operator can curl the app directly or reach
      # the admin through an SSH tunnel. Publishing it on 0.0.0.0 would put an
      # unencrypted copy of the site next to the TLS one and let anyone bypass
      # Cloudflare by asking the origin IP.
      - '127.0.0.1:${APP_PORT:-3000}:3000'
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging: *logging
    deploy:
      # Scale with `docker compose up -d --scale app=N` behind a load balancer.
      # Remove the fixed host port above before scaling past one.
      replicas: 1
      resources:
        limits:
          # Sized for a 2 GB droplet sharing the box with worker, Postgres and
          # Redis. These are caps, not reservations, so the sum may exceed RAM;
          # swap absorbs the overlap. Override per-service after a resize.
          memory: ${APP_MEMORY_LIMIT:-768m}

  worker:
    image: ${WORKER_IMAGE:-ghcr.io/msriaj/dhakalive-worker:latest}
    restart: always
    <<: *app-env
    environment:
      APP_ENV: production
      NODE_ENV: production
      JOBS_RUN_IN_PROCESS: 'true'
    depends_on:
      redis:
        condition: service_healthy
    logging: *logging
    deploy:
      # Exactly one. Scheduled publication is not safe to run concurrently.
      replicas: 1
      resources:
        limits:
          memory: ${WORKER_MEMORY_LIMIT:-384m}

  # Automated ingest. Separate from the worker so a model or upstream outage
  # stalls only this, leaving scheduled publication and cache purging running.
  #
  # Idles unless INGEST_ENABLED is true in .env, so deploying it is not the same
  # decision as turning it on.
  ingest:
    image: ${INGEST_IMAGE:-ghcr.io/msriaj/dhakalive-ingest:latest}
    restart: always
    <<: *app-env
    environment:
      APP_ENV: production
      NODE_ENV: production
      JOBS_RUN_IN_PROCESS: 'false'
    logging: *logging
    deploy:
      # Exactly one. Two would read the same listing and race on the dedupe
      # check, publishing the same story twice.
      replicas: 1
      resources:
        limits:
          memory: ${INGEST_MEMORY_LIMIT:-384m}

  # TLS termination and the only container published to the internet.
  #
  # Cloudflare cannot proxy to port 3000 — it reaches origins on 80/443 and a
  # short list of alternates — so without this the proxy returns 521 no matter
  # how healthy the app is.
  caddy:
    image: caddy:2-alpine
    restart: always
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-dhakalive.com}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and OCSP staples. Without this volume Caddy re-issues on
      # every restart, which burns rate limits on a real CA.
      - caddy-data:/data
      - caddy-config:/config
      # Cloudflare Origin CA certificate, when moving to "Full (strict)".
      # Optional: the directory may be empty.
      - ./caddy/certs:/etc/caddy/certs:ro
    depends_on:
      app:
        condition: service_healthy
    # Both listeners accepting connections. Deliberately not an HTTP request:
    # port 80 answers every path with a 308 to https://<domain>, and busybox
    # wget always follows redirects, so the probe would leave the box, go out
    # through Cloudflare and come back — measuring the internet, not Caddy.
    # Caddy exits on a bad config, so "listening" plus the app's own healthcheck
    # covers the failure modes that matter.
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 80 && nc -z 127.0.0.1 443']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging
    deploy:
      resources:
        limits:
          memory: ${CADDY_MEMORY_LIMIT:-128m}

  redis:
    image: redis:7-alpine
    restart: always
    # No persistence: Redis holds rate-limit counters and ephemeral cache here.
    # Losing it costs nothing; persisting it invites a stale-state incident.
    command:
      [
        'redis-server',
        '--appendonly',
        'no',
        '--save',
        '',
        '--maxmemory',
        '${REDIS_MAXMEMORY:-96mb}',
        '--maxmemory-policy',
        'allkeys-lru',
      ]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logging
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-128m}

  # One-shot migration runner. Not started by `up`; invoked explicitly by the
  # deploy script *before* the new app image starts serving, so the schema is
  # never behind the code that expects it.
  #
  #   docker compose --env-file .env -f docker/docker-compose.prod.yml run --rm migrate
  #
  # Runs from the WORKER image, not the web image. The web image is a Next
  # standalone build, and Next's output tracing only includes what the server
  # actually imports at runtime — the Payload CLI is not imported, so
  # `payload/bin.js` does not exist there at all. The worker image carries a
  # real dependency tree along with the config and migration files.
  migrate:
    image: ${WORKER_IMAGE:-ghcr.io/msriaj/dhakalive-worker:latest}
    profiles: ['tools']
    <<: *app-env
    working_dir: /repo/apps/web
    command: ['node', 'node_modules/payload/bin.js', 'migrate']
    restart: 'no'
    logging: *logging

# Caddy's issued certificates. Losing these means re-issuing on every restart,
# which hits certificate-authority rate limits on a real CA.
volumes:
  caddy-data:
    name: dhakalive-caddy-data
  caddy-config:
    name: dhakalive-caddy-config

# Both stacks share one pre-created network so the app can reach the database by
# hostname while the database publishes no port beyond loopback.
#
# Declared external because `server-bootstrap.sh` creates it. Compose refuses to
# adopt a network it did not create itself — it checks its own labels and fails
# with "was found but has incorrect label com.docker.compose.network" — so the
# ownership has to be stated rather than implied.
#
# If it is missing:  docker network create dhakalive_default
networks:
  default:
    name: dhakalive_default
    external: true
